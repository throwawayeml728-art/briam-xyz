<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#fafaf8"/>
  <rect x="40" y="40" width="720" height="520" rx="8" fill="#fff" stroke="#e8e8e4" stroke-width="1"/>
  <text x="80" y="120" font-family="Georgia, serif" font-size="48" fill="#1a1a18">Gmail, simplified.</text>
  <text x="80" y="170" font-family="system-ui, sans-serif" font-size="18" fill="#888884">A minimal Gmail client for people who like</text>
  <text x="80" y="200" font-family="system-ui, sans-serif" font-size="18" fill="#888884">shortcuts, search, and calm interfaces.</text>
  <rect x="80" y="240" width="120" height="40" rx="20" fill="#1a1a18"/>
  <text x="110" y="266" font-family="system-ui, sans-serif" font-size="14" fill="#fafaf8">Try demo</text>
  <rect x="220" y="240" width="100" height="40" rx="20" fill="none" stroke="#e8e8e4" stroke-width="1"/>
  <text x="245" y="266" font-family="system-ui, sans-serif" font-size="14" fill="#1a1a18">Notify</text>
  <rect x="80" y="320" width="640" height="180" rx="6" fill="#f4f1ec"/>
  <text x="100" y="360" font-family="system-ui, sans-serif" font-size="12" fill="#888884" letter-spacing="2">OMOU.APP</text>
  <text x="100" y="400" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a18">omou keeps Gmail's data model, but cuts</text>
  <text x="100" y="430" font-family="system-ui, sans-serif" font-size="16" fill="#1a1a18">most of the noise around it.</text>
</svg>
